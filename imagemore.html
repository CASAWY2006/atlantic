<style>
  /* Style de base pour la page */
  body {
    background-color: #111;
    overflow-x: hidden; /* Empêche le défilement horizontal de la page entière */
    margin: 0;
    font-family: sans-serif;
    color: white;
    text-align: center;
    padding: 2em 0;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 2em;
  }

  /* Conteneur pour une ceinture d'images */
  .image-belt {
    display: flex;
    width: max-content; /* S'assure que le conteneur est assez large pour toutes les images */
    margin-bottom: 20px; /* Espace entre les ceintures */
  }

  /* Animation pour le défilement des images */
  .scrolling-left {
    animation: scroll-left 40s linear infinite;
  }

  /* Conteneur qui masque le surplus d'images */
  .belt-container {
    width: 100%;
    overflow: hidden; /* Cache les images qui dépassent */
  }

  /* Style pour chaque image */
  .image-belt img {
    height: 200px; /* Hauteur des images */
    margin: 0 10px; /* Marge entre les images */
    border-radius: 10px; /* Bords arrondis pour un look moderne */
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); /* Ombre portée */
    transition: transform 0.3s ease; /* Animation au survol */
  }

  /* Effet de zoom au survol de l'image */
  .image-belt:hover img {
    transform: scale(1.05);
  }

  /* Animation de défilement de droite à gauche */
  @keyframes scroll-left {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-50%); /* Déplace le conteneur de la moitié de sa largeur */
    }
  }

  /* Arrête l'animation quand la souris est sur la ceinture */
  .image-belt:hover {
    animation-play-state: paused;
  }
  
  /* AJOUT : Style pour cacher le bouton menu sur grand écran */
  .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
  }

/* Responsive design optimisé pour les téléphones */
@media screen and (max-width: 768px) {
    body {
        font-size: 14px;
        padding: 0;
        overflow-x: hidden;
    }

    .header-container {
        padding: 5px 15px;

        justify-content: space-between;
        align-items: center;

    }

    .menu-toggle {

        position: absolute;

    .main-nav {
        display: none; /* Le menu est caché par défaut */

        top: 100%; /* Se positionne sous le header */

        padding: 10px;
    }
    
    /* Cette classe sera ajoutée par JavaScript pour afficher le menu */
    .main-nav.active {
        display: block; 
    }

    .main-nav ul {
        flex-direction: column;
        padding: 10px;
        margin: 0;
    }

    .main-nav ul li a {

    }

    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo img {
        height: 40px;
        width: auto;
    }

    .logo-text {
        font-size: 18px;
    }

    .container {
        width: 100%;

        flex-direction: column;
    }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .hero-section {
    padding: 20px 0;
    margin-top: 60px;
    position: relative;
    z-index: 2;
  }

  .hero-content {
    text-align: center;
    padding: 15px 10px;
    background: transparent;
    margin: 0 auto;
    max-width: 100%;
    position: relative;
    backdrop-filter: blur(3px);
  }

  .hero-content h1.spaced-title {
    font-size: 32px;
    margin-bottom: 10px;
    white-space: nowrap;
    letter-spacing: 2px;
    color: var(--color-gold);
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  .hero-content h2 {
    font-size: 22px;
    margin-bottom: 15px;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  .hero-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 0;
  }

  .btn {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 25px;
  }

  nav ul li {
    width: 100%;
    text-align: center;
  }

  nav ul li a {
    display: block;
    padding: 8px;
  }

  .header {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.9);
  }

  .header, .footer {
    text-align: center;
    padding: 10px 5px;
  }

  .hero-content {
    padding: 10px;
    margin-top: 60px;
  }

  .admins-section {
    padding: 20px 10px;
    background: rgba(0, 0, 0, 0.7);
    margin: 20px 10px;
    border-radius: 15px;
  }

  .admins-section h2 {
    text-align: center;
    color: var(--color-gold);
    margin-bottom: 20px;
    font-size: 22px;
  }

  .admins-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 10px;
  }

  .admin-card {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    transition: transform 0.3s ease;
  }

  .admin-card:active {
    transform: scale(0.95);
  }

  .admin-card img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 10px;
    object-fit: cover;
    border: 2px solid var(--color-gold);
  }

  .admin-card h3 {
    color: white;
    font-size: 14px;
    margin: 5px 0;
  }

  .admin-card p {
    color: var(--color-gold);
    font-size: 12px;
    margin: 0;
  }
}
